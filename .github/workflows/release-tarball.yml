name: Release tarball

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build tarball
        id: build
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            darkchain-v*)
              NAME="darkchain-${TAG#darkchain-v}"
              PATHS="libdark dkim2-darkchain LICENSE README.md"
              ;;
            darkarc-v*)
              NAME="darkarc-${TAG#darkarc-v}"
              PATHS="libdark darkarc LICENSE README.md"
              ;;
            *)
              echo "Tag $TAG non gestito, salto il build."
              echo "SKIP=true" >> $GITHUB_ENV
              exit 0
              ;;
          esac

          # Genero il tarball usando le variabili locali del case
          git archive --format=tar.gz --prefix="${NAME}/" \
              -o "${NAME}.tar.gz" HEAD $PATHS
          
          # Dico allo step successivo che abbiamo un file pronto
          echo "SKIP=false" >> $GITHUB_ENV

      - name: Upload asset
        if: env.SKIP == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" ./*.tar.gz --clobber
