name: Release tarball

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            darkchain-v*)
              NAME="darkchain-${TAG#darkchain-v}"
              # 1. Crea la cartella pulita
              mkdir -p "$NAME"
              # 2. Copia fisicamente SOLO i file e le cartelle necessari
              cp -r libdark dkim2-darkchain LICENSE README.md "$NAME/"
              ;;
            darkarc-v*)
              NAME="darkarc-${TAG#darkarc-v}"
              mkdir -p "$NAME"
              cp -r libdark darkarc LICENSE README.md "$NAME/"
              ;;
            *)
              echo "Tag $TAG non gestito, salto il build."
              echo "SKIP=true" >> $GITHUB_ENV
              exit 0
              ;;
          esac

          # 3. Zippa la cartella (tar classico di Linux, infallibile)
          tar -czvf "${NAME}.tar.gz" "$NAME"
          
          # 4. Segnala allo step successivo che è tutto pronto
          echo "SKIP=false" >> $GITHUB_ENV

      - name: Upload asset
        if: env.SKIP == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" ./*.tar.gz --clobber
